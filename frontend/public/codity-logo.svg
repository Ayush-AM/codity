<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B2E" />
      <stop offset="100%" stop-color="#0F0D17" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#7356F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="rgba(255,255,255,0.1)" stroke-width="8" />

  <!-- Outer Interconnected Queue Ring -->
  <rect x="64" y="64" width="384" height="384" rx="80" fill="none" stroke="url(#primary-grad)" stroke-width="12" opacity="0.4" />

  <!-- Hexagonal / Nodes Representation -->
  <circle cx="128" cy="128" r="16" fill="#06B6D4" />
  <circle cx="384" cy="128" r="16" fill="#8B5CF6" />
  <circle cx="384" cy="384" r="16" fill="#38BDF8" />
  <circle cx="128" cy="384" r="16" fill="#A855F7" />

  <!-- Connecting Queue Lines -->
  <line x1="128" y1="128" x2="384" y2="128" stroke="url(#primary-grad)" stroke-width="6" opacity="0.3" stroke-dasharray="12 12" />
  <line x1="384" y1="128" x2="384" y2="384" stroke="url(#primary-grad)" stroke-width="6" opacity="0.3" stroke-dasharray="12 12" />

  <!-- High-Precision Energy / Task Bolt Glyph -->
  <path d="M296 88 L168 280 H264 L216 424 L344 232 H248 Z" fill="url(#primary-grad)" filter="url(#glow)" />
</svg>
